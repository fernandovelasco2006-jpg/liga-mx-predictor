name: Análisis semanal Liga MX

# Corre liga_mx_analisis_semanal.py: actualiza aciertos de la jornada
# pasada y guarda en Supabase predicciones, apuestas y parlay de la
# jornada actual.
on:
  schedule:
    - cron: "0 12 * * 1"  # lunes 12:00 UTC (6:00 hora del centro de México)
  workflow_dispatch:

jobs:
  analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr análisis semanal
        env:
          SUPABASE_URL_LIGAMX: ${{ secrets.SUPABASE_URL_LIGAMX }}
          SUPABASE_KEY_LIGAMX: ${{ secrets.SUPABASE_KEY_LIGAMX }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: python liga_mx_analisis_semanal.py
